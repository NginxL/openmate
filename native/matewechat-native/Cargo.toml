[package]
name = "matewechat-native"
version = "0.1.5"
edition = "2021"
license = "MIT"
publish = false
description = "OpenMate's WeChat link: QR sign-in, live messages and text sends for the openmate-wechat extension, over JSON lines on stdin/stdout"

[dependencies]
# The protocol library of thisnick/agent-wechat (MIT), pinned; only its documented public API is used.
wechat-protocol = "=2.7.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
rqrr = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
