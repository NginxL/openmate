name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the published packages are checked against the target branch
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, python -I)
        run: PYTHON=python scripts/test.sh
      - name: Packages and persona-extensions.json are up to date, published packages unchanged
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            python -I -B scripts/package.py --check  # a first push: nothing published before it
          else
            [ -n "$base" ] || base=$(git rev-parse HEAD~1)  # a manual run: against the commit before
            git cat-file -e "$base" 2>/dev/null || git fetch --no-tags origin "$base" || { echo "base $base not found"; exit 1; }
            python -I -B scripts/package.py --check --published "$base"
          fi

  native:
    name: matewechat-native (Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/matewechat-native/target
          key: native-${{ hashFiles('native/matewechat-native/Cargo.lock', 'native/matewechat-native/rust-toolchain.toml') }}
      - name: cargo test
        working-directory: native/matewechat-native
        run: cargo test --locked
